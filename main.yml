version: '3'

vars:
  COMFYUI_PATH: "$COMFYUI_PATH"
  MODELS: "$COMFYUI_PATH/models"
  NODES:  "$COMFYUI_PATH/custom_nodes"
  HF_TOKEN: $HF_TOKEN
  CIVITAI_API_KEY: $CIVITAI_API_KEY

includes:
  core:
    taskfile: ./core.yml
    internal: true
  comfy-nodes:  ./comfy-nodes.yml
  birefnet:     ./comfy-models/birefnet.yml
  checkpoints:  ./comfy-models/checkpoints.yml
  clip:         ./comfy-models/clip.yml
  clip_vision:  ./comfy-models/clip_vision.yml
  ipadapter:    ./comfy-models/ipadapter.yml
  style_models: ./comfy-models/style_models.yml
  upscale:      ./comfy-models/upscale.yml
  vae:          ./comfy-models/vae.yml

tasks:

# ╔══════════════════════════════════════════════════════════════╗
# ║                    POST-PROCESS BUNDLE                      ║
# ╚══════════════════════════════════════════════════════════════╝
  all-sdxl-models:
    desc: "all base sdxl models + VAE"
    cmds:
      - task : base-nodes-bundle
      - task : pony-xl-base
      - task : checkpoints: dreamshaper-xl-v2-turbo
      - task : checkpoints: illustrious-xl-v2
      - task : checkpoints: noob-ai-xl-v1
      - task : sdxl-base-base
  base-nodes-bundle:
    desc: "all base nodes for kharma's workflows"
    cmds:
      - task: comfy-nodes:civitai-comfy-nodes
      - task: comfy-nodes:comfy-script-utils
      - task: comfy-nodes:comfyui-ultimatesdupscale
      - task: comfy-nodes:comfyui-ipadapter-plus
      - task: comfy-nodes:comfyui-birefnet-ll
  all-nodes-bundle:
    desc: "all base nodes for kharma's workflows"
    cmds:
      - task: base-nodes-bundle
      - task: comfy-nodes:extralinks
      - task: comfy-nodes:comfyui-kjnodes
      - task: comfy-nodes:packedpipes
      - task: comfy-nodes:rgthree-comfy
      - task: comfy-nodes:was-ns
      - task: comfy-nodes:comfyui-logicutils
  post-process-base:
    desc: "📦 Post-process: UltraSharp upscaler + BiRefNet"
    deps:
      - upscale:ultrasharp-v2
      - birefnet:birefnet

# ╔══════════════════════════════════════════════════════════════╗
# ║                       FLUX BUNDLES                          ║
# ╚══════════════════════════════════════════════════════════════╝

  flux-dev-base:
    desc: "📦 Flux dev — checkpoint + VAE + CLIP (L + T5 fp8 scaled)"
    deps:
      - checkpoints:flux-dev-v1
      - vae:flux-v1-vae
      - clip:l
      - clip:t5xxlfp16
      - clip:t5xxlfp8-scaled

  flux-dev-full:
    desc: "📦 Flux dev — base + Redux + post-process"
    deps:
      - task: flux-dev-base
      - style_models:flux-redux
      - task: post-process-base

  flux-schnell-base:
    desc: "📦 Flux schnell — checkpoint + VAE + CLIP (L + T5 fp8)"
    deps:
      - checkpoints:flux-schnell-v1
      - vae:flux-v1-vae
      - clip:l
      - clip:t5xxlfp8
      - clip:t5xxlfp8-scaled

  flux-schnell-full:
    desc: "📦 Flux schnell — base + Redux + post-process"
    deps:
      - task: flux-schnell-base
      - style_models:flux-redux
      - task: post-process-base

# ╔══════════════════════════════════════════════════════════════╗
# ║                       SDXL BUNDLES                          ║
# ╚══════════════════════════════════════════════════════════════╝

  # ── SDXL Base ──────────────────────────────────────────────
  sdxl-base-base:
    desc: "📦 SDXL Base v1 — checkpoint + VAE"
    deps:
      - checkpoints:sdxl-base-v1
      - vae:sdxl-v1-vae

  sdxl-base-full:
    desc: "📦 SDXL Base v1 — base + CLIP + IPAdapter + post-process"
    deps:
      - task: sdxl-base-base
      - ipadapter:sdxl-ipadapter-vit-h
      - clip_vision:sdxl-image-encoder-vit-h
      - task: post-process-base

  # ── DreamShaper XL ─────────────────────────────────────────
  dreamshaper-xl-base:
    desc: "📦 DreamShaper XL v2 Turbo — checkpoint + VAE"
    deps:
      - checkpoints:dreamshaper-xl-v2-turbo
      - vae:sdxl-v1-vae

  dreamshaper-xl-full:
    desc: "📦 DreamShaper XL v2 Turbo — base + CLIP + IPAdapter + post-process"
    deps:
      - task: dreamshaper-xl-base
      - ipadapter:sdxl-ipadapter-vit-h
      - clip_vision:sdxl-image-encoder-vit-h
      - task: post-process-base

  # ── Illustrious XL ─────────────────────────────────────────
  illustrious-xl-base:
    desc: "📦 Illustrious XL v2 — checkpoint + VAE"
    deps:
      - checkpoints:illustrious-xl-v2
      - vae:sdxl-v1-vae

  illustrious-xl-full:
    desc: "📦 Illustrious XL v2 — base + CLIP + IPAdapter + post-process"
    deps:
      - task: illustrious-xl-base
      - ipadapter:sdxl-ipadapter-vit-h
      - clip_vision:sdxl-image-encoder-vit-h
      - task: post-process-base

  # ── NoobAI XL ──────────────────────────────────────────────
  noob-ai-base:
    desc: "📦 NoobAI XL v1 — checkpoint + VAE"
    deps:
      - checkpoints:noob-ai-xl-v1
      - vae:sdxl-v1-vae

  noob-ai-full:
    desc: "📦 NoobAI XL v1 — base + CLIP + IPAdapter + post-process"
    deps:
      - task: noob-ai-base
      - ipadapter:sdxl-ipadapter-vit-h
      - clip_vision:sdxl-image-encoder-vit-h
      - task: post-process-base

  # ── Pony XL ────────────────────────────────────────────────
  pony-xl-base:
    desc: "📦 Pony XL v6 — checkpoint + власний VAE"
    deps:
      - checkpoints:pony-xl-v6
      - vae:pony-xl-v6-vae

  pony-xl-full:
    desc: "📦 Pony XL v6 — base + CLIP + IPAdapter + post-process"
    deps:
      - task: pony-xl-base
      - ipadapter:sdxl-ipadapter-vit-h
      - clip_vision:sdxl-image-encoder-vit-h
      - task: post-process-base