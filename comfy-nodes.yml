version: '3'
includes:
  core:
    taskfile: ./core.yml
    internal: true

tasks:
##base
  civitai-comfy-nodes:
    desc: "civitai loader-downloader nodes "
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: civitai_comfy_nodes

  comfy-script-utils:
    desc: "nodes to transform Image to PIL and back"
    deps: 
      - task: core:comfy-node
        vars:
          NODE_NAME: ComfyUI_Ib_CustomNodes
  extralinks:
    desc: "UI extra links between nodes"
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: extralinks
  comfyui-kjnodes:
    desc: "links via set / get nodes and others"
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: comfyui-kjnodes
  packedpipes:
    desc: "custom pipes"
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: packedpipes
  rgthree-comfy:
    desc: "utils, nodes + UI"
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: rgthree-comfy
  was-ns:
    desc: "nodes"
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: was-ns
## workflow
  comfyui-ultimatesdupscale:
    desc: "upscale nodes"
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: comfyui_ultimatesdupscale
  comfyui-ipadapter-plus:
    desc: "ipadapter nodes"
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: comfyui_ipadapter_plus
  comfyui-birefnet-ll:
    desc: "remove background nodes"
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: comfyui_birefnet_ll
  comfyui-logicutils:
    desc: "logic operation nodes"
    deps:
      - task: core:comfy-node
        vars:
          NODE_NAME: comfyui-logicutils

  

